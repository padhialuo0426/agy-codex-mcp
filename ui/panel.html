<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codex 子代理</title>
<style>
  :root { color-scheme: light dark; font: 14px/1.5 var(--font-sans, system-ui, sans-serif); }
  body {
    margin: 0;
    padding: 14px;
    background: var(--color-background-primary, Canvas);
    color: var(--color-text-primary, CanvasText);
    font-family: var(--font-sans, system-ui, sans-serif);
  }
  h1 { margin: 0 0 12px; font-size: 1.15rem; }
  h2 { margin: 10px 0 6px; font-size: 0.98rem; }
  label { display: block; margin-top: 9px; color: var(--color-text-secondary, inherit); }
  input, textarea, select, button { font: inherit; }
  input, textarea, select {
    box-sizing: border-box;
    color: var(--color-text-primary, CanvasText);
    background: var(--color-background-secondary, Canvas);
    border: 1px solid var(--color-border-primary, color-mix(in srgb, CanvasText 35%, transparent));
    border-radius: 5px;
    padding: 6px 8px;
  }
  input, textarea { width: 100%; }
  textarea { min-height: 74px; resize: vertical; }
  button {
    cursor: pointer;
    padding: 5px 10px;
    color: var(--color-text-primary, CanvasText);
    background: var(--color-background-secondary, ButtonFace);
    border: 1px solid var(--color-border-primary, color-mix(in srgb, CanvasText 35%, transparent));
    border-radius: 5px;
  }
  button.primary {
    background: var(--color-background-info, color-mix(in srgb, AccentColor 18%, transparent));
    border-color: var(--color-border-info, AccentColor);
    font-weight: 600;
  }
  button.danger {
    color: var(--color-text-danger, inherit);
    border-color: var(--color-border-danger, color-mix(in srgb, Crimson 55%, transparent));
  }
  button:disabled { cursor: default; opacity: .55; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .row select, .row input { min-width: 130px; flex: 1; }
  .log, #agents { max-height: 260px; overflow: auto; padding: 0; list-style: none; }
  .log li, #agents li { border-top: 1px solid var(--color-border-secondary, color-mix(in srgb, CanvasText 18%, transparent)); padding: 6px 0; overflow-wrap: anywhere; }
  p, pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: 4px 0; }
  details { margin-top: 10px; }
  #feedback { min-height: 1.5em; color: var(--color-text-secondary, inherit); }
  #question { font-weight: 600; }
  #approvals {
    margin: 10px 0;
    padding: 10px;
    border: 1px solid var(--color-border-warning, color-mix(in srgb, GoldenRod 60%, transparent));
    background: var(--color-background-warning, color-mix(in srgb, GoldenRod 10%, transparent));
    border-radius: 6px;
  }
  .approval-card {
    border-top: 1px solid var(--color-border-secondary, color-mix(in srgb, CanvasText 18%, transparent));
    padding-top: 8px;
    margin-top: 8px;
  }
  .approval-card:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; font-size: 0.85em; opacity: 0.9; }
  .badge {
    padding: 1px 6px;
    border-radius: 4px;
    background: var(--color-background-tertiary, color-mix(in srgb, CanvasText 12%, transparent));
  }
  .approval-card pre {
    font-size: 0.85em;
    max-height: 180px;
    overflow: auto;
    padding: 6px;
    border-radius: 4px;
    background: var(--color-background-primary, Canvas);
  }
</style>
</head>
<body>
<h1>Codex 子代理</h1>
<form id="group-form">
<label for="recent-groups">最近代理组</label>
<div class="row"><select id="recent-groups"><option value="">无历史代理组</option></select></div>
<label for="group">代理组 ID</label>
<div class="row"><input id="group" autocomplete="off" spellcheck="false" required><button>载入</button></div>
</form>
<p id="feedback" role="status" aria-live="polite"></p>
<section id="approvals" hidden aria-label="待审批请求">
  <h2>待审批请求</h2>
  <div id="approval-list"></div>
</section>
<ul id="agents" aria-label="子代理"></ul>
<label for="agent">子代理</label>
<div class="row">
  <select id="agent"></select>
  <button type="button" data-action="interrupt">中断</button>
  <button type="button" data-action="resume">恢复</button>
  <button type="button" data-action="close">关闭</button>
  <button type="button" data-action="changes">查看 diff</button>
</div>
<p id="question"></p>
<form id="message-form">
<label for="text">发送内容</label>
<textarea id="text" maxlength="6000" required></textarea>
<div class="row"><button data-mode="send">发送</button><button data-mode="followup">续派任务</button></div>
</form>
<details open><summary>消息</summary><ul id="messages" class="log"></ul></details>
<details id="changes" hidden><summary>工作树改动</summary><pre id="diff"></pre></details>
<!--BUNDLE-->
</body>
</html>
